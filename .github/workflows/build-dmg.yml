name: Build DMG (manual)

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build SwiftUI App
        run: |
          xcodebuild clean build \
            -project "MacCalendar.xcodeproj" \
            -scheme "MacCalendar" \
            -configuration Release \
            -sdk macosx \
            ENABLE_HARDENED_RUNTIME=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SYMROOT=$(pwd)/build \
            OBJROOT=$(pwd)/build \
            2>&1 | tee build.log

          if [[ ! -d build/Release/MacCalendar.app ]]; then
            echo "Build failed; last 80 lines:"
            tail -80 build.log
            exit 1
          fi

      - name: Ad-hoc sign app
        run: |
          APP=build/Release/MacCalendar.app
          EXEC="$APP/Contents/MacOS/MacCalendar"
          echo "== App bundle =="
          ls -la "$APP/Contents/MacOS/" || true
          if [[ ! -f "$EXEC" ]]; then
            echo "ERROR: 找不到可执行文件 $EXEC"
            exit 1
          fi
          xattr -cr "$APP"
          # 先签 executable，再签 .app（比 --deep 更稳）
          codesign --force --sign - --timestamp=none "$EXEC"
          codesign --force --sign - --timestamp=none "$APP"
          file "$EXEC"
          codesign -dv "$APP" 2>&1 || true

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG package
        run: |
          mkdir -p dmg_source dist
          ditto build/Release/MacCalendar.app dmg_source/MacCalendar.app
          xattr -cr dmg_source/MacCalendar.app
          create-dmg \
            --volname "MacCalendar Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "MacCalendar.app" 150 120 \
            --hide-extension "MacCalendar.app" \
            --app-drop-link 450 120 \
            "dist/MacCalendar.dmg" \
            "dmg_source/"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacCalendar-dmg
          path: dist/MacCalendar.dmg
          if-no-files-found: error
