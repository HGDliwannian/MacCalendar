name: Build DMG (manual)

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build SwiftUI App
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project "MacCalendar.xcodeproj" \
            -scheme "MacCalendar" \
            -configuration Release \
            -sdk macosx \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            SYMROOT=$(pwd)/build \
            OBJROOT=$(pwd)/build \
            2>&1 | tee build.log

          if [[ ! -d build/Release/MacCalendar.app ]]; then
            echo "Build failed; last 80 lines:"
            tail -80 build.log
            exit 1
          fi

      - name: Sign app bundle
        run: |
          chmod +x scripts/sign-app.sh
          ./scripts/sign-app.sh build/Release/MacCalendar.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG package
        run: |
          mkdir -p dmg_source dist
          ditto build/Release/MacCalendar.app dmg_source/MacCalendar.app
          xattr -cr dmg_source/MacCalendar.app
          create-dmg \
            --volname "MacCalendar Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "MacCalendar.app" 150 120 \
            --hide-extension "MacCalendar.app" \
            --app-drop-link 450 120 \
            "dist/MacCalendar.dmg" \
            "dmg_source/"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacCalendar-dmg
          path: dist/MacCalendar.dmg
          if-no-files-found: error
